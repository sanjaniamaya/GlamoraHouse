<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | GLAMORA HOUSE</title>
    <link href="https://fonts.googleapis.com/css2?family=Italiana&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="../css/signup.css">
</head>
<body class="animated-bg">

    <div class="nav-wrapper" id="navbar">
        <nav>
            <a href="index.html" class="logo">GLAMORA HOUSE</a>
            <div class="nav-links" id="navLinks">
                <div class="close-menu" onclick="toggleMenu()"><i class="fas fa-times"></i></div>
                <a href="index.html#about">About</a>
                <a href="services.html">Services</a>
                <a href="index.html#pricing">Pricing</a>
                <a href="index.html#staff">Staff</a>
                <a href="gallery.html">Gallery</a>
                <a href="index.html#contact">Contact</a>
            </div>
            <div class="nav-right">
                <a href="login.html" class="btn-login">Login</a>
                <a href="index.html#contact" class="btn-book">Book Now</a>
            </div>
            <div class="menu-toggle" onclick="toggleMenu()"><i class="fas fa-bars"></i></div>
        </nav>
    </div>

    <div class="auth-container">
        <div class="auth-box">
            <h2>Join Glamora</h2>
            <p>Create an account to book effortlessly</p>

            <form class="auth-form">
                <div class="input-group"><input type="text" id="name" placeholder="Full Name" required></div>
                <div class="input-group"><input type="email" id="email" placeholder="Email Address" required></div>
                <div class="input-group"><input type="tel" id="phone" placeholder="Phone Number" required></div>
                
                <div class="input-group">
                    <input type="password" id="pass" placeholder="Password" required>
                    <i class="fas fa-eye eye-icon" onclick="togglePassword('pass', this)"></i>
                </div>
                
                <div class="input-group">
                    <input type="password" id="confirmPass" placeholder="Confirm Password" required>
                    <i class="fas fa-eye eye-icon" onclick="togglePassword('confirmPass', this)"></i>
                </div>
                
                <button type="submit" class="btn-full">Create Account</button>
            </form>

            <div class="divider">OR REGISTER WITH</div>

            <button class="btn-google">
                <i class="fab fa-google"></i> Sign up with Google
            </button>

            <div class="auth-links">
                Already have an account? <a href="login.html">Login</a>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2025 GLAMORA HOUSE. All Rights Reserved.</p>
    </footer>

    <script src="../js/signup.js" type="module"></script>

    

</body>
</html>
